<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Dashboard | AI Report Generator</title>

  <link rel="stylesheet" href="/static/css/styles.css" />

  <style>
    body {
      background: linear-gradient(135deg, #667eea, #764ba2);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    .dashboard-container {
      max-width: 900px;
      margin: auto;
      padding: 2rem;
    }

    /* HEADER */
    .dashboard-header {
      text-align: center;
      color: white;
      margin-bottom: 2.5rem;
    }

    .dashboard-header h1 {
      font-size: 2.8rem;
      font-weight: 800;
      margin-bottom: 0.5rem;
    }

    .dashboard-header p {
      font-size: 1.1rem;
      opacity: 0.9;
    }

    /* LOGOUT */
    .logout-link {
      position: absolute;
      top: 20px;
      right: 20px;
      color: white;
      opacity: 0.85;
      text-decoration: none;
      font-size: 0.9rem;
      transition: 0.3s;
    }

    .logout-link:hover {
      opacity: 1;
      color: #ff6b6b;
    }

    /* CARD */
    .card {
      background: rgba(255,255,255,0.95);
      backdrop-filter: blur(10px);
      border-radius: 18px;
      padding: 2rem;
      box-shadow: 0 20px 40px rgba(0,0,0,0.15);
      transition: 0.3s;
    }

    .card:hover {
      transform: translateY(-3px);
    }

    .card h2 {
      font-size: 1.6rem;
      margin-bottom: 1.5rem;
    }

    /* INPUT */
    .form-group label {
      font-weight: 600;
      margin-bottom: 0.5rem;
      display: block;
    }

    .input-wrapper input {
      width: 100%;
      padding: 14px;
      border-radius: 12px;
      border: 2px solid #e5e7eb;
      font-size: 1rem;
      transition: 0.3s;
    }

    .input-wrapper input:focus {
      border-color: #6366f1;
      outline: none;
      box-shadow: 0 0 0 4px rgba(99,102,241,0.15);
    }

    /* FEATURE LIST */
    .feature-list {
      margin-top: 1.5rem;
      padding: 1.2rem;
      border-radius: 12px;
      background: linear-gradient(135deg, #eef2ff, #f5f3ff);
      border: 1px solid #e0e7ff;
    }

    .feature-list h3 {
      margin-bottom: 0.8rem;
      font-size: 1rem;
    }

    .feature-list ul {
      list-style: none;
      padding: 0;
      margin: 0;
    }

    .feature-list li {
      padding: 6px 0;
      font-size: 0.95rem;
      color: #4b5563;
    }

    .feature-list li::before {
      content: "✔ ";
      color: #6366f1;
      font-weight: bold;
    }

    /* BUTTON */
    .submit-section {
      text-align: center;
      margin-top: 2rem;
    }

    button {
      background: linear-gradient(135deg, #6366f1, #7c3aed);
      color: white;
      border: none;
      padding: 14px 28px;
      font-size: 1rem;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.3s ease;
      font-weight: 600;
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 20px rgba(99,102,241,0.3);
    }

    /* SPINNER */
    #spinner-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.6);
      align-items: center;
      justify-content: center;
      flex-direction: column;
      color: white;
      z-index: 999;
    }

    .spinner {
      border: 4px solid rgba(255,255,255,0.3);
      border-top: 4px solid white;
      border-radius: 50%;
      width: 50px;
      height: 50px;
      animation: spin 1s linear infinite;
      margin-bottom: 1rem;
    }

    @keyframes spin {
      100% { transform: rotate(360deg); }
    }

    /* MOBILE */
    @media (max-width: 768px) {
      .dashboard-header h1 {
        font-size: 2rem;
      }
    }
  </style>
</head>

<body>
  <div class="dashboard-container">

    <a href="/logout" class="logout-link">🚪 Logout</a>

    <div class="dashboard-header">
      <h1>🎯 Welcome, {{ user }}!</h1>
      <p>Generate AI-powered research reports in minutes</p>
    </div>

    <div class="card">
      <h2>📝 New Report</h2>

      <form id="generateForm" action="/generate_report" method="post">

        <div class="form-group">
          <label>What would you like to research?</label>
          <div class="input-wrapper">
            <input
              type="text"
              name="topic"
              placeholder="e.g., AI in Healthcare, Climate Change Solutions..."
              required
            />
          </div>
        </div>

        <div class="feature-list">
          <h3>✨ Your report includes:</h3>
          <ul>
            <li>Expert perspectives</li>
            <li>Real-time web research</li>
            <li>AI insights & synthesis</li>
            <li>PDF & DOCX export</li>
            <li>Iterative refinement</li>
          </ul>
        </div>

        <div class="submit-section">
          <button type="submit">🚀 Generate Report</button>
        </div>

      </form>
    </div>
  </div>

  <div id="spinner-overlay">
    <div class="spinner"></div>
    <p>🔬 Generating your AI report...</p>
  </div>

  <script>
    const form = document.getElementById("generateForm");
    const spinner = document.getElementById("spinner-overlay");

    form.addEventListener("submit", () => {
      spinner.style.display = "flex";
    });
  </script>
</body>
</html>
